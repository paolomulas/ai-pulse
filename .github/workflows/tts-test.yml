name: AI Pulse - Generate one curated audio asset
on:
  workflow_dispatch:
concurrency:
  group: ai-pulse-gemini-tts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r collector/requirements.txt
      - name: Generate one selected Italian editorial audio asset
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collector/tts_test.py
      - name: Commit sample audio and feed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json public/tts_state.json public/audio/
          if git diff --cached --quiet; then
            echo "No new audio sample generated"
          else
            git commit -m "Add Gemini TTS Italian audio sample"
            git push
          fi
