name: AI Pulse collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Check Python syntax
        run: python -m py_compile collector/main.py
      - name: Validate configuration
        run: python collector/main.py --validate-only
      - name: Collect and export feed
        run: python collector/main.py --export public/feed.json
      - name: Publish updated feed to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Update AI Pulse feed"
            git push
          fi
