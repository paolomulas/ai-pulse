name: AI Pulse collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Python syntax check
        run: python -m py_compile collector/main.py
      - name: Validate configuration
        run: python collector/main.py --validate-only
      - name: Publish to Firestore
        if: ${{ vars.ENABLE_FIRESTORE_PUBLISH == 'true' }}
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python collector/main.py
