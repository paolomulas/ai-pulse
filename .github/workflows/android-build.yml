name: Android build
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" SDK package was removed by Google.
          packages: ""
      - name: Install Android 36 platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Decode and validate Play upload keystore when configured
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          configured=0
          for value in "$ANDROID_UPLOAD_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "No upload keystore configured; release bundle will be unsigned."
          elif [ "$configured" -ne 4 ]; then
            echo "Incomplete Android signing secrets. Configure all four secrets." >&2
            exit 1
          else
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > app/upload-key.jks
            chmod 600 app/upload-key.jks
            keytool -list -keystore app/upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          fi
      - name: Assemble debug APK and release bundle
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease
      - name: Verify release bundle signing
        run: |
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$AAB"
          if [ -f app/upload-key.jks ]; then
            OUTPUT="$(jarsigner -verify -verbose -certs "$AAB" 2>&1)"
            printf '%s\n' "$OUTPUT" | grep -q "jar verified."
            echo "Release AAB signature verified."
          else
            echo "::warning::Release AAB is unsigned because upload-key secrets are not configured."
          fi
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
